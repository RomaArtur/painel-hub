<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRACKen Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "sans-serif"] },
            colors: { tracken: { green: "#74C843", dark: "#2A2A2A" } },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-[#F3F4F6] text-gray-800 font-sans">
    <header class="bg-black">
      <div class="h-14 flex items-center justify-center">
        <img
          src="logo-tracken-icon.png"
          alt="TRACKen"
          class="h-8 w-8 object-contain"
        />
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8">
      <div class="flex gap-2 mb-6">
        <button
          type="button"
          id="tab-paineis"
          onclick="showTab('paineis')"
          class="px-4 py-2 rounded-lg text-sm font-semibold bg-white border border-gray-200 shadow-sm"
        >
          Painéis
        </button>
        <button
          type="button"
          id="tab-prototipos"
          onclick="showTab('prototipos')"
          class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-white"
        >
          Protótipos isolados
        </button>
      </div>

      <section id="list-paineis" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></section>
      <section id="list-prototipos" class="grid grid-cols-1 sm:grid-cols-2 gap-4 hidden"></section>
    </main>

    <script>
      const PANELS = {
        newSeller: "https://feature-encontrar-transportadora.vercel.app",
        seller: "https://feature-pedidos-em-atraso-vendedor.vercel.app",
        operacional: "https://painel-operacional.vercel.app",
      };

      const PAINEIS = [
        { name: "TRACKen New Seller", href: PANELS.newSeller },
        { name: "TRACKen Seller", href: PANELS.seller },
        { name: "TRACKen Operacional", href: PANELS.operacional },
      ];

      const PROTOTIPOS = [
        {
          name: "Encontrar transportadora / vínculo",
          from: "New Seller",
          href: PANELS.newSeller.replace(/\/$/, "") + "/?solo=vinculo",
        },
        {
          name: "Controle de reputação (vendedor)",
          from: "Seller",
          href: PANELS.seller.replace(/\/$/, "") + "/?solo=reputacao",
        },
        {
          name: "Controle de reputação (operacional)",
          from: "Operacional",
          href: PANELS.operacional.replace(/\/$/, "") + "/?solo=reputacao",
        },
        {
          name: "Solicitações de vínculo",
          from: "Operacional",
          href: PANELS.operacional.replace(/\/$/, "") + "/?solo=vinculo",
        },
      ];

      function cardPanel(item) {
        return `
          <a href="${item.href}" target="_blank" rel="noopener"
            class="block bg-white rounded-xl border border-gray-200 p-5 hover:border-tracken-green hover:shadow-md transition-all">
            <h2 class="font-semibold text-gray-900">${item.name}</h2>
          </a>`;
      }

      function cardProto(item) {
        return `
          <a href="${item.href}" target="_blank" rel="noopener"
            class="block bg-white rounded-xl border border-gray-200 p-5 hover:border-tracken-green hover:shadow-md transition-all">
            <p class="text-[10px] font-semibold uppercase tracking-wide text-gray-400 mb-1">${item.from}</p>
            <h2 class="font-semibold text-gray-900">${item.name}</h2>
          </a>`;
      }

      document.getElementById("list-paineis").innerHTML = PAINEIS.map(cardPanel).join("");
      document.getElementById("list-prototipos").innerHTML = PROTOTIPOS.map(cardProto).join("");

      function showTab(tab) {
        const paineis = tab === "paineis";
        document.getElementById("list-paineis").classList.toggle("hidden", !paineis);
        document.getElementById("list-prototipos").classList.toggle("hidden", paineis);
        const btnP = document.getElementById("tab-paineis");
        const btnF = document.getElementById("tab-prototipos");
        btnP.className = paineis
          ? "px-4 py-2 rounded-lg text-sm font-semibold bg-white border border-gray-200 shadow-sm"
          : "px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-white";
        btnF.className = !paineis
          ? "px-4 py-2 rounded-lg text-sm font-semibold bg-white border border-gray-200 shadow-sm"
          : "px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-white";
      }
    </script>
  </body>
</html>
