<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRACKen Hub</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "sans-serif"] },
            colors: { tracken: { green: "#74C843", dark: "#2A2A2A" } },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-[#F3F4F6] text-gray-800 font-sans">
    <header class="bg-black">
      <div class="h-14 flex items-center justify-center">
        <img
          src="logo-tracken.png"
          alt="TRACKen"
          class="h-8 w-auto object-contain"
        />
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8">
      <div class="flex gap-2 mb-6">
        <button
          type="button"
          id="tab-paineis"
          onclick="showTab('paineis')"
          class="px-4 py-2 rounded-lg text-sm font-semibold bg-white border border-gray-200 shadow-sm"
        >
          Painéis
        </button>
        <button
          type="button"
          id="tab-prototipos"
          onclick="showTab('prototipos')"
          class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-white"
        >
          Protótipos isolados
        </button>
      </div>

      <section id="list-paineis" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></section>
      <section id="list-prototipos" class="grid grid-cols-1 sm:grid-cols-2 gap-4 hidden"></section>
    </main>

    <script>
      const PANELS = {
        newSeller: "https://feature-encontrar-transportadora.vercel.app",
        seller: "https://feature-pedidos-em-atraso-vendedor.vercel.app",
        operacional: "https://feature-pedidos-em-atraso.vercel.app",
      };

      const PAINEIS = [
        { name: "TRACKen New Seller", href: PANELS.newSeller },
        { name: "TRACKen Seller", href: PANELS.seller },
        { name: "TRACKen Operacional", href: PANELS.operacional },
      ];

      const PROTOTIPOS = [
        {
          name: "Encontrar transportadora / vínculo",
          from: "New Seller",
          href: PANELS.newSeller.replace(/\/$/, "") + "/?solo=vinculo",
          bullets: [
            "Busca de transportadoras no mapa por nome e CEP de coleta",
            "Raio de cobertura e rota até o ponto de coleta",
            "Solicitação de vínculo com dados cadastrais do seller",
            "Acompanhamento do status da análise (aguardando, em contato, aprovada, recusada, concluída)",
            "Histórico da solicitação e contato por WhatsApp",
          ],
        },
        {
          name: "Controle de reputação (vendedor)",
          from: "Seller",
          href: PANELS.seller.replace(/\/$/, "") + "/?solo=reputacao",
          bullets: [
            "Lista de remessas com reputação afetada (qualquer ocorrência, não só atraso)",
            "Colunas: remessa, ID de venda ML, loja, data prevista, data contábil e status FNVJ",
            "Filtro por período da data contábil (coleta ou recebimento) e métricas do painel",
            "Introdução na primeira visita e “Como funciona”",
            "Carteira de pacotes (Flexível R$ 9 e Escala R$ 7, mínimo 50)",
            "Débito de 1 remoção por acionamento da Fique no Verde Já",
            "Comprovante discreto da liquidação Asaas (90% FNVJ / 10% TRACKen)",
          ],
        },
        {
          name: "Controle de reputação (operacional)",
          from: "Operacional",
          href: PANELS.operacional.replace(/\/$/, "") + "/?solo=reputacao",
          bullets: [
            "Mesmo fluxo do vendedor, com a coluna Cliente no lugar de Loja",
            "Lista de remessas com reputação afetada (qualquer ocorrência, não só atraso) e status FNVJ",
            "Filtro por período da data contábil (coleta ou recebimento) e métricas",
            "Carteira de pacotes Flexível e Escala",
            "Débito de 1 remoção por acionamento",
            "Comprovante discreto da liquidação Asaas",
          ],
        },
        {
          name: "Solicitações de vínculo",
          from: "Operacional",
          href: PANELS.operacional.replace(/\/$/, "") + "/?solo=vinculo",
          bullets: [
            "Fila de pedidos enviados pelo New Seller",
            "Análise: entrar em contato, aprovar ou recusar",
            "Cadastro do cliente (documento, razão social, nome fantasia, telefone, CEP, número, ambiente, CST)",
            "Vínculo de serviços (ML, Shopee, Amazon, Magalu) com tabelas de preço de exemplo",
            "Campos opcionais: e-mail, complemento e observações",
            "Criação de login (e-mail, usuário, documento, WhatsApp, senha) com perfil Cliente bloqueado",
            "Compartilhar acesso com o seller (e-mail, WhatsApp ou copiar)",
            "Devolução do status da análise para o New Seller",
          ],
        },
      ];

      function cardPanel(item) {
        return `
          <a href="${item.href}" target="_blank" rel="noopener"
            class="block bg-white rounded-xl border border-gray-200 p-5 hover:border-tracken-green hover:shadow-md transition-all">
            <h2 class="font-semibold text-gray-900">${item.name}</h2>
          </a>`;
      }

      function cardProto(item) {
        const bullets = (item.bullets || [])
          .map((line) => `<li>${line}</li>`)
          .join("");
        return `
          <a href="${item.href}" target="_blank" rel="noopener"
            class="block bg-white rounded-xl border border-gray-200 p-5 hover:border-tracken-green hover:shadow-md transition-all">
            <p class="text-[10px] font-semibold uppercase tracking-wide text-gray-400 mb-1">${item.from}</p>
            <h2 class="font-semibold text-gray-900">${item.name}</h2>
            <ul class="mt-3 list-disc pl-4 space-y-1 text-xs text-gray-500 leading-relaxed">${bullets}</ul>
          </a>`;
      }

      document.getElementById("list-paineis").innerHTML = PAINEIS.map(cardPanel).join("");
      document.getElementById("list-prototipos").innerHTML = PROTOTIPOS.map(cardProto).join("");

      function showTab(tab) {
        const paineis = tab === "paineis";
        document.getElementById("list-paineis").classList.toggle("hidden", !paineis);
        document.getElementById("list-prototipos").classList.toggle("hidden", paineis);
        const btnP = document.getElementById("tab-paineis");
        const btnF = document.getElementById("tab-prototipos");
        btnP.className = paineis
          ? "px-4 py-2 rounded-lg text-sm font-semibold bg-white border border-gray-200 shadow-sm"
          : "px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-white";
        btnF.className = !paineis
          ? "px-4 py-2 rounded-lg text-sm font-semibold bg-white border border-gray-200 shadow-sm"
          : "px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-white";
      }
    </script>
  </body>
</html>
